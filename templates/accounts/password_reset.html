{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | Royal Maltipoos{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white p-8 rounded-3xl border border-stone-200 shadow-sm space-y-5">
    <div class="text-center space-y-1">
      <span class="badge-gold text-[10px]">Client Security</span>
      <h1 class="font-serif text-3xl font-bold text-forest">Reset Password</h1>
      <p class="text-stone-500 text-xs">Enter your account email to receive secure recovery instructions.</p>
    </div>

    <form method="POST" class="space-y-4 text-xs">
      {% csrf_token %}
      <div>
        <label class="block font-bold text-forest uppercase tracking-wider mb-1">Email Address *</label>
        <input type="email" name="email" required placeholder="your.email@example.com" class="form-input text-xs">
      </div>

      <button type="submit" class="btn-primary w-full py-3 text-sm justify-center shadow-md">
        Dispatch Recovery Email &rarr;
      </button>
    </form>

    <div class="text-center pt-2 text-xs border-t border-stone-100">
      <a href="{% url 'accounts:login' %}" class="text-stone-500 hover:text-forest">&larr; Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
